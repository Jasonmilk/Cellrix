[package]
name = "cellrix-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust implementation of the CommonIntents protocol stack: CIN7 and CIC13 data structures with fault-tolerant parsers under BIND-19 (CIB19) standard"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
