[package]
name = "cellrix-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "TUI renderer for Cellrix: ratatui backend, semantic components"

[dependencies]
cellrix-protocol = { path = "../protocol" }
cellrix-layout = { path = "../layout" }
cellrix-transport = { path = "../transport" }

# Async runtime & stream utilities
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# Terminal UI
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }

# Async utilities
futures = "0.3"

# Error handling
thiserror = "1.0"

# Serialization
serde_json = "1.0"

# Request ID generation
rand = "0.10.1"

# Optional components (enable later as needed)
# tui-markdown = "0.4"
# syntect = "5.0"

[dev-dependencies]
clap = { version = "4.0", features = ["derive"] }
