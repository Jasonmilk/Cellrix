[package]
name = "cellrix-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "TUI renderer for Cellrix: ratatui backend, semantic components"

[dependencies]
cellrix-protocol = { path = "../protocol" }
cellrix-layout = { path = "../layout" }
cellrix-transport = { path = "../transport" }
tokio = { version = "1.0", features = ["full"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
futures = "0.3"
thiserror = "1.0"
serde_json = "1.0"
# tui-markdown = "0.4"       # optional, uncomment later
# syntect = "5.0"            # optional, uncomment later

[dev-dependencies]
clap = { version = "4.0", features = ["derive"] }
