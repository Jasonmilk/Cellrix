[package]
name = "cellrix"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime for Rust
tokio = { version = "1", features = ["full"] }

# Core TUI (Terminal UI) framework
ratatui = "0.26"
crossterm = "0.27"

# Layout engine for isomorphic TUI/Web rendering
taffy = "0.4"

# HTTP client for CAP protocol communication
reqwest = { version = "0.12", features = ["json"] }

# Async trait support
async-trait = "0.1"

# Thread communication
crossbeam-channel = "0.5"

# Serialization/deserialization framework
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utility libraries
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
