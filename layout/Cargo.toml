[package]
name = "cellrix-layout"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dual-track layout solver for Cellrix: explicit grid + implicit heuristics, semantic focus, zen mode"

[dependencies]
cellrix-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "1.0"

# Target-specific dependency block. Natively guarantees zero overhead on native TUI builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
cellrix-protocol = { path = "../protocol" }
