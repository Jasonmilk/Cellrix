[package]
name = "cellrix-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI debug tool for Cellrix pipeline (protocol + layout + transport)"

[dependencies]
cellrix-protocol = { path = "../protocol" }
cellrix-layout = { path = "../layout" }
cellrix-transport = { path = "../transport" }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"   # For CLI error handling only; not in core libs
hex = "0.4"
serde_json = "1.0"
