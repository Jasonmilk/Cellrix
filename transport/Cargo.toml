[package]
name = "cellrix-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Transport layer for Cellrix: STDIO, UDS, TCP with CIB format negotiation"

[dependencies]
cellrix-protocol = { path = "../protocol" }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
rmp-serde = "1.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }   # ADDED
thiserror = "1.0"
async-trait = "0.1"
tokio-stream = "0.1.18"
uuid = { version = "1.0", features = ["v4", "serde"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
