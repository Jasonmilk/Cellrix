[package]
name = "mock-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mock Anaphase agent for testing Cellrix pipeline"

[dependencies]
cellrix-protocol = { path = "../protocol" }
tokio = { version = "1.0", features = ["full"] }
rmp-serde = "1.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
