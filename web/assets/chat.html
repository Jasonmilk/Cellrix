    <div class="panel chat-panel">
      <div class="chat-grid">
        <div class="chat-col">
          <div id="cont-banner" class="cont-banner" style="display:none;"></div>
          <div id="chat-msgs" class="chat-msgs">
            <div class="empty"><div class="orb" aria-hidden="true">⌁</div><b>尚未开始的对话</b><p>说句话吧——这是给 Helix 的一段新经历。</p></div>
          </div>
          <div class="chat-input">
            <!-- MULTI-LINE COMPOSER (owner request): Enter makes a newline, Cmd/Ctrl+Enter sends, Esc clears.
                 The 「续接」 control is gone: clicking a conversation in the sidebar IS the way to continue
                 one, so a second, competing entry point only invited the two to disagree (§299). -->
            <textarea id="chat-text" class="inp" rows="1" autocomplete="off"
                      style="resize:none;min-height:2.6em;max-height:12em;overflow-y:auto;line-height:1.45"
                      placeholder="输入消息，⌘/Ctrl+Enter 发送（Enter 换行 / Esc 清除）"></textarea>
            <button type="button" class="btn btn-primary" onclick="sendChat()">发送</button>
          </div>
        </div>
      </div>
    </div>
