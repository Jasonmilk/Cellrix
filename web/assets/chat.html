    <div class="panel chat-panel">
      <div class="head">对话（伙伴模式 · 单周期一轮 · 走 Tuck 网关审计）</div>
      <div class="chat-grid">
        <div class="ses-side" id="chat-side"><div class="empty">经历列表加载中…</div></div>
        <div class="chat-col">
          <div id="cont-banner" class="cont-banner" style="display:none;"></div>
          <div id="chat-msgs" class="chat-msgs">
            <div class="empty"><div class="orb" aria-hidden="true">⌁</div><b>尚未开始的对话</b><p>说句话吧——这是给 Helix 的一段新经历。</p></div>
          </div>
          <div class="chat-input">
            <input id="chat-text" class="inp" type="text" placeholder="输入消息，回车发送（Enter 发送 / Esc 清除）" autocomplete="off">
            <button type="button" class="btn btn-primary" onclick="sendChat()">发送</button>
            <button type="button" class="btn btn-ghost" onclick="toggleResume()" title="续接某段经历继续对话">续接</button>
            <div id="resume-list" class="resume-list" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>
