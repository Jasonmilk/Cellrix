<style>
  /* ---------- 经历列表（水之波光血统） ----------
     它是**唯一**的一份，住在框架左栏里（`.fxSideBody` 提供那一个滚动上下文）。
     边框与内边距不再由它自己带：那是栏的事，栏已经在做。 */
  .ses-side { min-height:0; display:flex; flex-direction:column; gap:8px; }
  .ses-side > * { flex-shrink:0; }   /* see .chat-msgs: the window scrolls, the card keeps its size */
  /* 侧栏模式切换：同一个列表，两种**被显式选择**的用途（N-015 / N-016）。
     模式是可见的、被选中的，位置固定在侧栏顶部——不随视图变化。 */
  .ses-mode { display:inline-flex; margin:0 0 6px; border:1px solid var(--line-strong);
    border-radius:var(--r-md); overflow:hidden; }
  .ses-mode .btn { border-radius:0; border:0; min-height:30px; padding:0 12px; font-size:11.5px; }
  .ses-mode .btn + .btn { border-left:1px solid var(--line-strong); }
  .ses-mode .btn.on { background:var(--accent-soft); color:var(--text); font-weight:600; }
  .ses-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:2px 2px 6px; font-size:11px; color:var(--text-dim); }
  .ses-item { padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-md);
    cursor:pointer; font-size:12px; background:var(--surface); position:relative;
    --ses-bg: var(--surface); /* 操作区遮罩跟随卡片态（涟漪同色消散） */
    min-height:44px; /* P-010 热区 44px：操作按钮垂直居中的稳定容器 */
    transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
  .ses-item:hover { border-color:var(--accent); background:var(--surface-hover); --ses-bg: var(--surface-hover); }
  .ses-item.sel { border-color:var(--accent); background:var(--accent-soft); --ses-bg: var(--accent-soft); }
  .ses-item .nm { color:var(--text); font-weight:600; word-break:break-all;
    /* One-line clamp: a flat list carries more per row, and a long title used
     * to push the row wider than its column. */
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
    overflow:hidden;
    margin-bottom:2px; }
  /* The meta line is ONE line, always. It carries metadata (time / event count /
     id), so it is the thing that may be shortened — and it must never wrap,
     because a wrap here changes the card's height. */
  .ses-item .t { color:var(--text-dim); font-size:11px; display:flex; align-items:center;
    gap:6px; flex-wrap:nowrap; }
  .ses-item .t > :not(.act) { min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* iOS swipe 风格操作区：绝对定位右缘浮出（滑入），不占文档流 → 内容零挤压。
     渐变遮罩 = 涟漪消散：按钮盖住文本尾部时平滑过渡，不穿帮 */
  /* The card's actions live ON THE META LINE and RESERVE their room. They used
     to be centred over the whole card with a background gradient masking the
     text beneath them — a cover-up, not a layout: measured, the points inside
     the name and the preview resolved to the buttons instead of the text. The
     space is derived from the button the actions are made of (.btn-icon.sm). */
  .ses-item .t { position:relative; }
  .ses-item .t .act { position:absolute; right:0; top:50%;
    transform:translateY(-50%) translateX(10px);
    height:fit-content; display:flex; align-items:center; gap:4px; opacity:0;
    pointer-events:none;
    transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .ses-item:hover .t .act, .ses-item.sel .t .act,
  .ses-item.editing .t .act { opacity:1; transform:translateY(-50%); pointer-events:auto; }
  /* The room is reserved PERMANENTLY. Reserving it only on :hover moved the meta
     line's content onto a second line and pulled the whole card taller — a hover
     that changes the geometry is worse than no hover state at all. The state
     only decides whether the actions are VISIBLE; the box is the same either way. */
  .ses-item .t { padding-right:calc(34px * 2 + 20px); }
  /* A 2-line clamp with `white-space:nowrap` is not a style, it is a
     contradiction: the box promises two lines and `nowrap` renders one, so the
     preview was squeezed to half of what it was designed to show. Measured:
     clamp 2, shown 1. The clamp does its own ellipsis, so `text-overflow` here
     was the second copy of one fact. */
  .ses-item .p { margin-top:3px; color:var(--text); word-break:break-all;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ses-item .p.dim { color:var(--text-dim); font-style:italic; }
  /* 会话聚合（线程化）：续接轮次缩进跟随其根，视觉上是一段连续对话 */
    border-top-left-radius:0; border-bottom-left-radius:0; }
  .ses-item .t .mdl { color:var(--accent); font-size:10.5px; font-weight:500; }
  .ses-item .p.rp { margin-top:1px; color:var(--text-dim); font-size:11.5px;
    -webkit-line-clamp:1; }
  /* 内联重命名编辑态：标题行原位变输入框（同盒模型零位移），
     操作按钮替换行尾 ✎（同尺寸 44px），行结构恒定（水之波光 P-022 空间记忆） */
  .ses-item .ses-edit { display:block; }
  .ses-item .ses-edit .inp { width:100%; padding:0; margin:0; border:none;
    background:transparent; color:var(--text); font:inherit; font-weight:600;
    outline:none; box-shadow:inset 0 -1px 0 var(--accent); }
  /* 编辑态：操作按钮常显（不依赖 hover，触境反馈稳定） */
  .ses-item.editing .t .act { display:flex; }
  .btn-icon { width:44px; height:44px; min-width:44px; padding:0; display:inline-flex;
    align-items:center; justify-content:center; border-radius:var(--r-md);
    border:1px solid var(--line); background:transparent; color:var(--text-dim);
    cursor:pointer; font-size:14px; }
  .btn-icon:hover { border-color:var(--accent); color:var(--accent); }
  .btn-icon.sm { width:34px; height:34px; min-width:34px; font-size:12px; }
  /* 骨架屏（加载中）：脉冲明暗是"进行中"的确定性信号 [PHYS:C-003] */
  .sk { border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px;
    background:var(--surface); animation:sk-pulse 1.2s ease-in-out infinite alternate; }
  .sk .sk-l1 { height:10px; width:45%; border-radius:3px; background:var(--line); opacity:.6; }
  .sk .sk-l2 { height:10px; width:80%; border-radius:3px; background:var(--line);
    opacity:.35; margin-top:8px; }
  @keyframes sk-pulse { from { opacity:.55; } to { opacity:1; } }
  .ses-stats { display:flex; gap:16px; padding:8px 12px; border-bottom:1px solid var(--line);
    font-size:12px; flex-wrap:wrap; }
  .ses-stats span { color:var(--text-dim); }
  .ses-stats b { color:var(--text); font-weight:600; }
  .resume-list { position:absolute; right:12px; bottom:54px; width:280px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-2); z-index:10;
    max-height:260px; overflow:auto; }
  .resume-opt { padding:10px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--line);
    color:var(--text); word-break:break-all; }
  .resume-opt:hover { background:var(--surface-hover); }
  .cont-banner { padding:8px 12px; font-size:11px; color:var(--accent);
    border-bottom:1px solid var(--line); background:var(--accent-soft); display:flex;
    align-items:center; gap:8px; }
  .cont-banner .btn-icon { margin-left:auto; }
  .rename-btn { margin-left:8px; font-size:11px; padding:4px 8px; min-height:32px;
    border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--text-dim);
    cursor:pointer; font-family:inherit; }
  .rename-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* 证轨比例 2D 网格（概览 / 明细）—— 具体列比由视图内联 style 裁决 */
  /* 4a geometry: prove-track main grid fills the shell (Q4); at ≥1180px the
     inspector becomes the third column (Q1, see prove_track.css media rule). */
  /* 侧栏已在框架左栏，这里只剩主区（见 Q1：两栏足够，不要第三栏）。 */
  .prove-track-main { display:grid; grid-template-columns:minmax(0,1fr); gap:12px;
    margin-bottom:16px; flex:1 1 auto; min-height:0; }
  #view-prove-track #s-main { min-height:0; }
  #view-prove-track #s-main { overflow:hidden; display:flex; flex-direction:column; }
  #view-prove-track #s-main .e-wrap { flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; }
  /* 4a geometry: cockpit ledger fills the shell; the table scrolls inside. */
  #view-cockpit > .panel.ledger { flex:1 1 auto; min-height:0; display:flex;
    flex-direction:column; }
  #view-cockpit .tbl-shell { flex:1 1 auto; min-height:0; }
  .timeline { max-height:420px; overflow-y:auto; }

</style>
