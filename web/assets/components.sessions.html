<style>
  /* ---------- 经历列表（模板 v8 · 行式语言） ----------
     功能结构钩子全部保留（.ses-item/.nm/.t/.p/.mdl/.act/.edit/.sel/
     .ses-head/.sk/.resume-list/.cont-banner/.rename-btn/.ses-stats），
     视觉换为 v8 的 hist-item：无边框行、悬停浅背景、选中左标线。
     它住在框架左栏（.fxSideBody 提供唯一滚动上下文）。 */
  .ses-side { min-height:0; display:flex; flex-direction:column; gap:6px; }
  .ses-side > * { flex-shrink:0; }
  .ses-head { display:flex; align-items:center; justify-content:space-between; gap:8px;

  .ses-item { display:block; width:100%;
    min-height:44px; padding:8px 10px 8px 12px; border:0; border-radius:var(--r-md);

    transition:background var(--dur) var(--ease), color var(--dur) var(--ease); }
  .ses-item:hover { background:var(--row-hover); color:var(--text-1); }
  .ses-item.sel { background:var(--row-sel); color:var(--text-1); }

  .ses-item .nm { color:var(--text-1); font-weight:600; word-break:break-all;

    overflow:hidden; margin-bottom:2px; }
  .ses-item .t { color:var(--text-dim); font-size:11px; display:flex; align-items:center;
    gap:6px; flex-wrap:nowrap; }

    text-overflow:ellipsis; white-space:nowrap; }

    transform:translateY(-50%) translateX(10px);
    height:fit-content; display:flex; align-items:center; gap:4px; opacity:0;

  /* 骨架屏（加载中）：脉冲明暗是"进行中"的确定性信号 [PHYS:C-003] */

</style>
