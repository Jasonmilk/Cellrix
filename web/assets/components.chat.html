<style>
  /* ---------- 对话 ----------
     消息流 + 思考折叠 + 续接列表（内联样式清零） */
  /* 4a geometry (panel-geometry-contract Q4): the view shell owns the
     viewport height; panes scroll INSIDE it, the page never scrolls as a
     whole. Q2: the sidebar width is a device-derived clamp, not a constant.
     Q3: each pane has exactly one scroll context — `.chat-msgs` fills the
     height the layout gives it (`flex:1 1 auto; min-height:0`) instead of
     being capped by a max-height constant. */
  html, body { height:100%; }
  body { overflow:hidden; display:flex; flex-direction:column; }
  #view-cockpit, #view-prove-track, #view-chat, #view-flows { flex:1 1 auto; min-height:0;
    overflow:hidden; display:flex; flex-direction:column; }
  #view-chat > .panel.chat-panel { flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; }
  /* A flex ROW (not grid): a grid row is sized by content, which severs the
     height chain — measured col 62px with the input alone at 65px. A flex
     row stretches both children to the chain the layout gives them. */
  .chat-grid { display:flex; gap:12px; padding:12px; flex:1 1 auto; min-height:0; }
  .chat-grid > .ses-side { width:clamp(200px,18vw,320px); flex-shrink:0; }
  .chat-col { min-width:0; display:flex; flex-direction:column; min-height:0; flex:1 1 auto; }
  /* A transcript is unbounded, so its window has to be bounded by something.
     That something is the layout's height chain (Q4), not a number: the old
     420px/`--pane-h` constants cropped content (measured: 581px of transcript
     in a 420px window). */
  .chat-msgs { flex:1 1 auto; min-height:0; overflow-y:auto; padding:12px; display:flex;
    flex-direction:column; gap:8px; }
  /* A scroller's items must not be compressed BY the scroller.
     `display:flex` here makes every child a flex item, and a flex item SHRINKS by
     default: when the content exceeds the window, flexbox squeezes the ITEMS
     instead of letting the window scroll. Measured on the transcript: a row whose
     content was 306px got a 35px box, and its overflow was painted over by the
     next row — "展开思考被遮住" was this, not the row's own CSS. Same shape in the
     sidebar, where 2682px of cards were squeezed to their 44px minimum.
     The division is: the WINDOW scrolls, an ITEM keeps the size its content gives
     it. One declaration, and it is the same declaration at both scrollers. */
  .chat-msgs > * { flex-shrink:0; }
  /* A scroller's items must not be compressed BY the scroller.
     `display:flex` here makes every child a flex item, and a flex item SHRINKS by
     default: when the content exceeds the window, flexbox squeezes the ITEMS
     instead of letting the window scroll. Measured on the transcript: a row whose
     content was 306px got a 35px box, and its overflow was painted over by the
     next row — "展开思考被遮住" was this, not the row's own CSS. Same shape in the
     sidebar, where 2682px of cards were squeezed to their 44px minimum.
     The division is: the WINDOW scrolls, an ITEM keeps the size its content gives
     it. One declaration, and it is the same declaration at both scrollers. */
  .chat-msgs > * { flex-shrink:0; }
  .msg { max-width:85%; padding:8px 12px; border-radius:var(--r-md); font-size:12.5px;
    line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent-soft); color:var(--text); }
  .msg.helix { align-self:flex-start; background:var(--surface); border:1px solid var(--line); }
  .msg .who { display:block; font-size:10px; color:var(--text-dim); margin-bottom:3px; }
  .msg .ts { float:right; margin-left:10px; font-size:10px; color:var(--text-dim); opacity:.75; }
  .msg.err { border-color:var(--danger); color:var(--risk); }
  .chat-input { position:relative; display:flex; gap:8px; padding:10px 12px;
    border-top:1px solid var(--line); align-items:center; }
  .chat-input .inp { flex:1; }
  /* A process row's FORM follows its content. Closed, the body shares the
     label's line and is elided; open, it takes a full line of its own and the
     row grows to whatever the text needs. `flex-wrap` is what makes that
     possible: without it a flex row cannot give one child a line of its own, and
     the box was left at a fixed height while its content spilled out — measured:
     row 36px, content 267px, with the NEXT row painted over it.
     `min-height` is a floor (the 44px-touch-area lineage), never a cap. */
  .think-row { padding:8px 12px; font-size:11px; color:var(--text-dim); cursor:pointer;
    display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;
    border-bottom:1px solid var(--line); min-height:36px; }
  .think-row:hover { background:var(--surface-hover); }
  .think-row .think-head { color:var(--accent); font-weight:600; flex-shrink:0; }
  .think-row .think-body { flex:1 1 auto; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:88%; }
  /* No cap and no inner scroller: a transcript has ONE scroll context (the
     message list). A second one inside a row makes the box decide the content
     instead of the content deciding the box. */
  .think-row.open .think-body { flex:1 1 100%; max-width:100%;
    white-space:pre-wrap; word-break:break-word; }
  .think-row.fold .think-head { color:var(--text-dim); } /* 过程行（计划/工具）次级强调，思考行保持 accent */
  /* check/verdict rows (timeline): PASS green, FAIL red — the verdict is the
     row's headline, the reason is the expandable body. */
  .think-row.chk-pass .think-head { color:#3E9B5F; }
  .think-row.chk-fail .think-head { color:#D64545; }
  .msg .mdl { color:var(--accent); font-weight:500; font-size:10px; }
  /* `.fold` is a STATE (open/closed), not a layout. It used to declare
     `display:inline-block` for an inline fold widget — and process rows carry
     `fold` too, so that one declaration quietly overrode the row's own
     `display:flex` (equal specificity, later in source). One element has one
     display, and only the element's own layout rule may declare it. */
  .fold { cursor:pointer; }
  .fold .fold-head { color:var(--accent); font-weight:600; }
  .fold .fold-tip { color:var(--text-dim); transition:transform var(--dur) var(--ease); }
  .fold.open .fold-tip { transform:rotate(90deg); display:inline-block; }
  .fold .fold-body { display:none; }
  .fold.open .fold-body { display:inline; }
  .fold .think-full { display:inline; white-space:pre-wrap; word-break:break-all;
    max-height:160px; overflow:auto; font-size:11px; color:var(--text); }
</style>
