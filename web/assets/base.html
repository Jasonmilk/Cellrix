<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellrix — Cockpit + ProveTrack</title>
  <meta name="color-scheme" content="dark light">
  <script>
  (function(){
    var K='cellrix-theme', R=document.documentElement, mq=matchMedia('(prefers-color-scheme: dark)');
    function cur(){ try{ return localStorage.getItem(K)||'auto'; }catch(e){ return 'auto'; } }
    function apply(m){ var real=m==='auto'?(mq.matches?'dark':'light'):m; R.setAttribute('data-theme',real); }
    apply(cur());
    window.__setTheme=function(m){ try{ localStorage.setItem(K,m); }catch(e){} apply(m);
      var bs=document.querySelectorAll('.theme-switch button');
      for(var i=0;i<bs.length;i++){ bs[i].className=bs[i].getAttribute('data-t')===m?'on':''; } };
    if(mq.addEventListener) mq.addEventListener('change',function(){ if(cur()==='auto') apply('auto'); });
  })();
  </script>
  __TOKENS__
  __COMPONENTS_CORE__
  __COMPONENTS_CHAT__
  __COMPONENTS_SESSIONS__
  __COMPONENTS_TRACK__
  __COMPONENTS_DEGRADE__
  <style>__PROVE_TRACK_CSS__</style>
</head>
<body>
  <!-- 框架 · 外壳就是视口（ADR-0022 N3 / Q3·Q4）。
       形状借自成熟实践：**页面级没有任何堆叠的家具**——chrome 活在栏内。
       左栏 = 经历列表（唯一一份）+ 状态/主题沉到栏底；中栏 = 主视图，自己一条高度链。
       真 Chrome 实测：改前内容要等 218px 的 h1/sub/bar/eco 四层堆完才开始；
       改后顶部只剩栏自己的头部（≈44px），且页面永不滚动，滚的是栏内部。 -->
  <div class="frame" id="uxFrame">

    <aside class="fxSide" id="uxSide">
      <div class="fxSideHd">
        <span class="brand">Cellrix</span>
        <span class="badge info" id="mode">…</span>
        <span class="badge info" id="state">…</span>
        <span class="badge info" id="conn">…</span>
      </div>
      <!-- 唯一的滚动上下文（左栏）。列表只有这一份：#chat-side 已经删掉。 -->
      <div class="fxSideBody" id="uxSideBody">
        <div class="ses-side" id="s-side"><div class="empty">经历列表加载中…</div></div>
      </div>
      <div class="fxSideFt">
        <span class="sub" id="sub">连接中…</span>
        <div class="eco" id="eco">生态点亮探测中…</div>
        <div class="theme-switch" role="group" aria-label="主题">
          <button type="button" data-t="auto" class="on" onclick="__setTheme('auto')">跟随</button>
          <button type="button" data-t="light" onclick="__setTheme('light')">日间</button>
          <button type="button" data-t="dark" onclick="__setTheme('dark')">暗黑</button>
        </div>
      </div>
    </aside>

    <main class="fxMain" id="uxMain">
      <div class="fxMainHd">
        <nav class="nav" aria-label="视图">
          <button type="button" class="btn on" id="v-cockpit" data-view="cockpit">驾驶舱 Cockpit</button>
          <button type="button" class="btn" id="v-prove-track" data-view="prove-track">证轨 ProveTrack</button>
          <button type="button" class="btn" id="v-chat" data-view="chat">对话 Chat</button>
          <button type="button" class="btn" id="v-flows" data-view="flows">检定台 Flows</button>
        </nav>
        <span class="foot">auto __REFRESH__s · <span id="audit" class="tag ok">…</span>
          <a href="/api/snapshot">snapshot</a> · <a href="/api/audit">audit</a></span>
      </div>

      <div id="view-cockpit">
        __COCKPIT__
      </div>

      <div id="view-prove-track" style="display:none;">
        <div class="prove-track-main">
          <div id="s-main">__PROVE_TRACK__</div>
        </div>
      </div>

      <div id="view-chat" style="display:none;">
        __CHAT__
      </div>

      <div id="view-flows" style="display:none;">
        __FLOWS__
      </div>
    </main>
  </div>
<script>__EVENT_FAMILY__</script>
