<script>
// === 会话管理资产（session.html）：列表 / 内联重命名 / 续接 / 新对话
// DSH 骨架：左侧会话列表 = 持久事实的索引，点击即恢复进度；水之波光血统：
// 骨架屏加载、零态自证、toast 反馈。共享状态走 window.Cx（script.html）。
(function () {
  var Cx = window.Cx || {};
  var st = Cx.state || {};
  /* The shell assembles before this piece (assets/boot.json fixes the order), so
   * the shared state exists by now — but read the selection through the live
   * global rather than a captured copy. `nav` is the shell's ONE selection state
   * (ADR-0022 N-003); a copy here would be a second one. */
  function nav() { return (window.Cx && window.Cx.state && window.Cx.state.nav) || {}; }

  function esc(s) { return Cx.esc ? Cx.esc(s) : String(s); }
  function skRow() {
    return '<div class="sk"><div class="sk-l1"></div><div class="sk-l2"></div></div>';
  }

  // auto name: 经历 + 首事件时间。标题行恒定 = 人名 > 自动名（永不裸挂
  // "无用户输入"）；preview 恒在正文行（行结构铁轨，P-022 空间记忆）。
  /* `first_ts` is an INSTANT, written by the producer in UTC (…Z). Slicing the
   * string showed UTC beside a reader whose clock is local — measured: a card
   * read 08:30 while its file was written at 16:30, eight hours out, and the
   * same field also names the card. An instant has no reader; the READER's clock
   * is the frame it is shown in. (The cockpit already shows a local clock, so
   * this is also the panel's existing convention.) If the string cannot be
   * parsed the raw text is shown — a wrong instant is worse than an unformatted
   * one, and inventing a local time here would be exactly that. */

  /* 列表渲染与「由列表可达的动作」在 session_list.js（见该资产文件头）。
   * 本资产只负责：取数、空态决策、注册两个视图的 enter hook。
   *
   * `esc` 与 `skRow` 仍定义在本文件里（本资产自己要用），**不要**再从
   * CxSessionList 取一份过来——同一作用域里 `var skRow = L.skRow` 会用
   * undefined 覆盖掉上面那个函数声明。实测：面板首屏即抛
   * `TypeError: skRow is not a function`，侧栏、证轨、对话三处一起空掉。 */
  var L = window.CxSessionList;

  function loadSessions() {
    var seq = ++st.sesSeq;
    var s = document.getElementById('s-side');
    var c = document.getElementById('chat-side');
    s.innerHTML = skRow() + skRow() + skRow();
    if (c) c.innerHTML = skRow() + skRow() + skRow();
    fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (j) {
      if (seq !== st.sesSeq) return; // 晚到的旧响应，丢弃
      var periods = j.periods || [];
      /* 零态也走出路层（ADR-0044）：这两句原先在本文件里手写，而同一段零态在
       * chat.html 的静态标记里还有第二份——两处会漂。出路就是让人去说第一句
       * 话，所以动作是「切到对话并把光标放进输入框」。 */
      var empty = j.configured
        ? { code: 'sessions-empty', action: { run: function () {
              Cx.setNav({ view: 'chat' });
              var t = document.getElementById('chat-text');
              if (t) t.focus();
            } } }
        : { code: 'sessions-unconfigured' };
      L.renderSide('s-side', periods, empty, false);
      L.renderSide('chat-side', periods, empty, true);
    }).catch(function (e) {
      if (seq !== st.sesSeq) return;
      /* 就地给出路：重试 = 再拉一次（本函数自己）。注意这个 catch 曾经把
       * ReferenceError 也接住并渲染成「经历列表拉取失败」——把代码缺陷说成
       * 取数失败。原始信息现在降级为可展开的 detail，不再冒充原因。 */
      var failState = {
        code: 'sessions-fetch-failed',
        detail: String(e && e.message || e),
        action: { run: function () { loadSessions(); } }
      };
      window.CxWayout.render(document.getElementById('s-side'), failState);
      var c = document.getElementById('chat-side');
      if (c) window.CxWayout.render(c, failState);
    });
  }

  window.CxSession = { loadSessions: loadSessions, toggleResume: L.toggleResume, newChat: L.newChat };
  window.toggleResume = L.toggleResume; // chat.html onclick 内联依赖全局

  /* The shell never names a view it does not own — a view asset declares its
   * own enter hook (ADR-0015 D8 follow-through). The experience list feeds
   * both the ProveTrack sidebar and the Chat sidebar, so this asset claims
   * both views; the shell just asks the registry. */
  if (Cx.onEnter) {
    Cx.onEnter('prove-track', loadSessions);
    Cx.onEnter('chat', loadSessions);
  }

  // 页面就绪即加载一次列表（默认停在 cockpit，切换视图再刷新）——
  // 对话/证轨侧栏不因"没切过视图"而停留在"加载中"。
  if (document.getElementById('s-side')) loadSessions();
})();
</script>
