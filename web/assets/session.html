<script>
// === 会话管理资产（session.html）：列表 / 内联重命名 / 续接 / 新对话
// DSH 骨架：左侧会话列表 = 持久事实的索引，点击即恢复进度；水之波光血统：
// 骨架屏加载、零态自证、toast 反馈。共享状态走 window.Cx（script.html）。
(function () {
  var Cx = window.Cx || {};
  var st = Cx.state || {};

  function esc(s) { return Cx.esc ? Cx.esc(s) : String(s); }
  function skRow() {
    return '<div class="sk"><div class="sk-l1"></div><div class="sk-l2"></div></div>';
  }

  // auto name: 经历 + 首事件时间。标题行恒定 = 人名 > 自动名（永不裸挂
  // "无用户输入"）；preview 恒在正文行（行结构铁轨，P-022 空间记忆）。
  function autoName(p) {
    if (p.name) return p.name;
    var ts = String(p.first_ts || '');
    return '经历 ' + ts.slice(5, 10) + ' ' + ts.slice(11, 16);
  }

  function loadSessions() {
    var seq = ++st.sesSeq;
    var s = document.getElementById('s-side');
    var c = document.getElementById('chat-side');
    s.innerHTML = skRow() + skRow() + skRow();
    if (c) c.innerHTML = skRow() + skRow() + skRow();
    fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (j) {
      if (seq !== st.sesSeq) return; // 晚到的旧响应，丢弃
      var periods = j.periods || [];
      var empty = '<div class="empty">' + (j.configured ? '尚无经历（先和 Helix 说句话）' : '未开启会话事件流（Anaphase config `session_events_path`）') + '</div>';
      renderSide('s-side', periods, empty, false);
      renderSide('chat-side', periods, empty, true);
    }).catch(function (e) {
      if (seq !== st.sesSeq) return;
      var msg = '<div class="empty">经历列表拉取失败: ' + esc(e.message) + '</div>';
      document.getElementById('s-side').innerHTML = msg;
      var c = document.getElementById('chat-side');
      if (c) c.innerHTML = msg;
    });
  }

  // `chatMode` drives the click behaviour: the chat sidebar loads the
  // period's history into the chat space (resume), the prove_track sidebar
  // opens its trajectory. One component, two intents [极致复用].
  function renderSide(id, periods, empty, chatMode) {
    var box = document.getElementById(id);
    if (!periods.length) { box.innerHTML = empty; return; }
    // 会话聚合（线程化）：period.parent 指向续接来源（context/inject
    // resume_from）。根（parent 为 null 或不在列表）为会话主卡，续接轮
    // 次缩进跟随 —— 连续对话不再被截断成互不相干的独立条目。
    var byJob = {};
    periods.forEach(function (p) { byJob[p.job_id] = p; });
    var roots = [], children = {};
    periods.forEach(function (p) {
      var par = p.parent && byJob[p.parent] ? p.parent : null;
      if (par) { (children[par] = children[par] || []).push(p); }
      else { roots.push(p); }
    });
    // 根按列表序（时间倒序）在前，其续接线程紧随；孤儿（父不在列表）
    // 已按根处理。连续对话 = 一个根 + 一串续接，不再被截断。
    var chain = [];
    roots.forEach(function (r) {
      chain.push(r);
      (children[r.job_id] || []).forEach(function (c) { chain.push(c); });
    });
    var rootCount = roots.length;
    var head = '<div class="ses-head"><span>' + rootCount + ' 个对话 · ' + periods.length + ' 轮</span>' +
      (chatMode ? '<button type="button" class="btn btn-sm btn-ghost" id="btn-newchat">+ 新对话</button>' : '') +
      '</div>';
    box.innerHTML = head;
    var headEl = box.firstChild;
    var nbtn = headEl && headEl.querySelector('#btn-newchat');
    if (nbtn) nbtn.onclick = function (ev) {
      ev.stopPropagation();
      newChat();
    };
    chain.forEach(function (p) {
      var div = document.createElement('div');
      var sel = (chatMode ? st.chatJobId : null) === p.job_id;
      var isChild = !!p.parent;
      div.className = 'ses-item' + (sel ? ' sel' : '') + (isChild ? ' child' : '');
      div.setAttribute('data-ts', p.first_ts || '');
      var ts = String(p.first_ts || '');
      var disp = ts.slice(5, 10) + ' ' + ts.slice(11, 16);
      // 行结构恒定（铁轨）：标题 .nm + 时间 .t + 正文 .p，重命名只换标题文本
      var nm = autoName(p);
      var preview = p.preview ? '<div class="p">' + esc(p.preview) + '</div>' : '';
      // 回答预览：period.reply（assistant/reply 交付物）——列表不再盲。
      var reply = p.reply ? '<div class="p rp">' + esc(p.reply) + '</div>' : '';
      var mdl = p.model ? '<span class="mdl">' + esc(p.model) + '</span>' : '';
      var tag = isChild ? '<span class="cont">↳ 续接</span>' : '';
      div.innerHTML =
        '<div class="nm">' + tag + esc(nm) + '</div>' +
        '<div class="t">' + esc(disp) + ' · ' + p.count + ' 事件 · <span class="tid">' + esc(p.job_id.slice(0, 12)) + '</span>' + mdl +
        '<span class="act"><button type="button" class="btn-icon sm" data-ren="' + esc(p.job_id) + '" title="重命名">✎</button></span></div>' +
        preview + reply;
      div.onclick = function () {
        if (chatMode) {
          // 恢复进度到对话空间（DSH：点击会话 = 回放过去 + 从此续写）
          st.chatJobId = p.job_id;
          renderSide('chat-side', periods, empty, true);
          loadPeriodToChat(p.job_id);
          setBanner('续接经历 <span class="tid">' + esc(p.job_id) + '</span> —— 下一句话延续这段对话');
          document.getElementById('chat-text').focus();
        } else {
          window.__proveTrackMeta = { job_id: p.job_id, name: p.name, preview: p.preview };
          Cx.showView('prove-track');
          Cx.selectPeriod(p.job_id);
        }
      };
      var rn = div.querySelector('[data-ren]');
      if (rn) rn.onclick = function (ev) {
        ev.stopPropagation();
        beginRename(div, p.job_id, p.name || '');
      };
      box.appendChild(div);
    });
  }

  // Inline rename — 零跳变（水之波光：行结构铁轨，编辑只换标题文本）：
  // 输入框 1:1 占据 .nm（同盒模型），✓/✗ 替换行尾 ✎（同尺寸），
  // 保存成功就地更新文本（不 loadSessions，无骨架闪烁/重排）；
  // 失败恢复原文 + toast，不跳转（触境：因果完成，反馈稳定可预期）。
  function beginRename(item, jobId, current) {
    if (item.querySelector('.ses-edit')) return;
    var nm = item.querySelector('.nm');
    var t = item.querySelector('.t');
    var act = t && t.querySelector('.act');
    var original = nm ? nm.textContent : '';
    var edit = document.createElement('div');
    edit.className = 'ses-edit';
    edit.innerHTML = '<input class="inp" value="' + esc(current) + '" placeholder="自动名：经历 + 时间" maxlength="80">';
    if (nm) { nm.textContent = ''; nm.appendChild(edit); }
    item.classList.add('editing');
    var ren = act && act.querySelector('[data-ren]');
    if (ren) ren.style.display = 'none';
    var save = null, cancel = null;
    if (act) {
      save = document.createElement('button');
      save.type = 'button'; save.className = 'btn-icon sm'; save.title = '保存'; save.textContent = '✓';
      cancel = document.createElement('button');
      cancel.type = 'button'; cancel.className = 'btn-icon sm'; cancel.title = '取消'; cancel.textContent = '✗';
      act.appendChild(save);
      act.appendChild(cancel);
    }
    var inp = edit.querySelector('.inp');
    inp.focus(); inp.select();
    function done(restore) {
      if (nm) nm.textContent = restore !== undefined ? restore : original;
      edit.remove();
      if (ren) ren.style.display = '';
      if (save) save.remove();
      if (cancel) cancel.remove();
      item.classList.remove('editing');
    }
    cancel.onclick = function (ev) { ev.stopPropagation(); done(); };
    save.onclick = function (ev) {
      ev.stopPropagation();
      var name = inp.value.trim();
      var btn = save;
      if (btn) btn.disabled = true;
      fetch('/api/sessions/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: jobId, name: name })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.ok) {
          done(name || autoName({ first_ts: String(item.getAttribute('data-ts') || '') }));
          Cx.showToast(name ? '已重命名' : '已恢复自动名');
        } else {
          done();
          Cx.showToast('重命名失败: ' + (j.error || 'unknown'));
        }
      }).catch(function (e) {
        done();
        Cx.showToast('重命名失败: ' + e.message);
      });
    };
    inp.onkeydown = function (ev) {
      if (ev.key === 'Enter') { ev.stopPropagation(); if (save) save.click(); }
      if (ev.key === 'Escape') { ev.stopPropagation(); if (cancel) cancel.click(); }
    };
  }

  // Load a past experience's history into the chat space (explicit resume):
  // user turns and answers render as messages, then the next sentence
  // continues the period (resume_from on the backend). seq-guarded: a slow
  // earlier fetch must not overwrite a session the user switched to.
  function loadPeriodToChat(jobId) {
    var seq = ++st.histSeq;
    var box = document.getElementById('chat-msgs');
    box.innerHTML = '<div class="period-head">—— 正在加载 ' + esc(jobId.slice(0, 12)) + ' 的历史 ——</div>';
    fetch('/api/events?job_id=' + encodeURIComponent(jobId)).then(function (r) { return r.json(); }).then(function (j) {
      if (seq !== st.histSeq) return;
      if (j.missing || !j.events) {
        box.innerHTML = '<div class="empty">' + (j.missing ? '该经历的事件文件缺失' : '没有可回放的事件') + '</div>';
        return;
      }
      // ADR-0018 T4: the window enters through the assembly layer, so this
      // target and ProveTrack accept the same facts by the same rules —
      // vocabulary-validated, deduped by seq, ordered by seq rather than by
      // whatever order the response happened to carry. What follows is this
      // target's own rendering: targets share the tape, not a display model.
      var asm = window.CxAssembly ? window.CxAssembly.create() : null;
      if (asm) asm.feed(j.events);
      var events = asm ? asm.events() : j.events;
      if (!events.length) {
        box.innerHTML = '<div class="empty">事件全部被拒收（未知类型或格式不符）</div>';
        return;
      }

      box.innerHTML = '';
      var pendingTool = null;
      var sawReply = false; // assistant/reply is the deliverable; turn/end
                            // only backfills periods written before it existed
      var d = document.createElement('div');
      d.className = 'period-head';
      d.textContent = '—— 经历 ' + jobId + ' 的历史 ——';
      box.appendChild(d);
      events.forEach(function (e) {
        if (e.type === 'user/message') { Cx.addMsg('user', e.data.text || '', false); }
        else if (e.type === 'assistant/think') { Cx.foldRow('思考', e.data.text || ''); }
        else if (e.type === 'assistant/attempt') { Cx.foldRow('计划', e.data.text || ''); }
        else if (e.type === 'tool/call') {
          // tool/call + tool/result pair into ONE fold row (no duplicate
          // helix messages): buffer the call, render on the matching result.
          pendingTool = { tool: e.data.tool || '', args: e.data.args || '' };
        }
        else if (e.type === 'tool/result') {
          var t = pendingTool || { tool: e.data.tool || '', args: '' };
          pendingTool = null;
          var label = '工具 · ' + t.tool + (e.data.ok === false ? ' · 失败' : '');
          var text = (t.args ? '调用 ' + JSON.stringify(t.args) + '\n' : '') + (e.data.outcome || '');
          Cx.foldRow(label, text);
        }
        else if (e.type === 'assistant/reply') { sawReply = true; Cx.addReplyMsg(e.data.text || '', e.data.model || ''); }
        else if (e.type === 'turn/end') {
          // Legacy fallback only: periods written before assistant/reply
          // carried the answer on turn/end alone. Never duplicate.
          if (!sawReply && e.data && e.data.reply) Cx.addReplyMsg(e.data.reply, e.data.model || '');
        }
      });
      box.scrollTop = box.scrollHeight;
    }).catch(function (e) {
      if (seq !== st.histSeq) return;
      box.innerHTML = '<div class="empty">历史加载失败: ' + esc(e.message) + '</div>';
    });
  }

  // Fresh conversation: drop the resume anchor, clear the space, restore
  // the honest empty state. The next message opens a NEW period.
  function newChat() {
    st.chatJobId = null;
    st.histSeq++; // 丢弃任何在途的历史加载
    var box = document.getElementById('chat-msgs');
    box.innerHTML = '<div class="empty"><div class="orb" aria-hidden="true">⌁</div><b>尚未开始的对话</b><p>说句话吧——这是给 Helix 的一段新经历。</p></div>';
    setBanner(null);
    document.getElementById('chat-text').focus();
  }

  function setBanner(html) {
    var b = document.getElementById('cont-banner');
    if (!b) return;
    if (html === null) { b.style.display = 'none'; b.innerHTML = ''; return; }
    b.style.display = '';
    b.innerHTML = html +
      '<button type="button" class="btn-icon sm" data-drop title="结束续接（开始新对话）">✗</button>';
    var drop = b.querySelector('[data-drop]');
    if (drop) drop.onclick = function () { newChat(); };
  }

  // Resume-from-experience dropdown: sits in the chat-input's bottom-right,
  // listing the latest periods to continue (explicit, never implicit).
  function toggleResume() {
    var list = document.getElementById('resume-list');
    if (list.style.display !== 'none') { list.style.display = 'none'; return; }
    fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (j) {
      var periods = (j.periods || []).slice(0, 8);
      list.innerHTML = periods.map(function (p) {
        return '<div class="resume-opt" data-job="' + esc(p.job_id) + '">' + esc(autoName(p)) + ' <span class="dim">' + esc(p.job_id.slice(0, 20)) + '</span></div>';
      }).join('') || '<div class="empty">尚无经历</div>';
      list.style.display = '';
      list.querySelectorAll('.resume-opt').forEach(function (el) {
        el.onclick = function () {
          st.chatJobId = el.getAttribute('data-job');
          list.style.display = 'none';
          setBanner('续接经历 <span class="tid">' + esc(st.chatJobId) + '</span> —— 下一句话延续这段对话');
          loadPeriodToChat(st.chatJobId);
          document.getElementById('chat-text').focus();
        };
      });
    }).catch(function () { list.innerHTML = '<div class="empty">经历列表拉取失败</div>'; list.style.display = ''; });
  }

  window.CxSession = { loadSessions: loadSessions, toggleResume: toggleResume, newChat: newChat };
  window.toggleResume = toggleResume; // chat.html onclick 内联依赖全局

  /* The shell never names a view it does not own — a view asset declares its
   * own enter hook (ADR-0015 D8 follow-through). The experience list feeds
   * both the ProveTrack sidebar and the Chat sidebar, so this asset claims
   * both views; the shell just asks the registry. */
  if (Cx.onEnter) {
    Cx.onEnter('prove-track', loadSessions);
    Cx.onEnter('chat', loadSessions);
  }

  // 页面就绪即加载一次列表（默认停在 cockpit，切换视图再刷新）——
  // 对话/证轨侧栏不因"没切过视图"而停留在"加载中"。
  if (document.getElementById('s-side')) loadSessions();
})();
</script>
