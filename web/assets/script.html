<script>
/* Shell — the frame every view shares: view switch, shared namespace, the
 * status line and the ecosystem board. View-specific rendering lives in its
 * own asset (chat.js / cockpit.js / session.html / flows.html / prove_track.*),
 * and a view declares its own enter hook via Cx.onEnter, so this file never
 * names a view it does not own.
 */
(function () {
  var refresh = __REFRESH__;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ---- view switch ------------------------------------------------------
   * The view list has exactly one source of truth: base.html's nav carries
   * `data-view` on every button. Adding a view = one nav entry + one
   * `#view-<name>` container + one asset file. This function never changes.
   * [GENE] 0 硬编码 —— 视图清单不写死在壳里。 */
  function navButtons() { return document.querySelectorAll('.nav [data-view]'); }

  /* Enter hooks are declared by the view assets themselves (Cx.onEnter), so
   * the shell never names a view it does not own. */
  var ENTER = {};
  function showView(v) {
    var bs = navButtons(), i, n;
    for (i = 0; i < bs.length; i++) {
      n = bs[i].getAttribute('data-view');
      var el = document.getElementById('view-' + n);
      if (el) el.style.display = (n === v) ? '' : 'none';
      bs[i].className = 'btn' + (n === v ? ' on' : '');
    }
    var hooks = ENTER[v] || [];
    for (i = 0; i < hooks.length; i++) hooks[i]();
  }

  window.Cx = {
    state: { chatJobId: null, sesSeq: 0, histSeq: 0, chatBusy: false },
    esc: esc,
    showView: showView,
    // Explicit continuation (ADR-0026): chatJobId 置位时，下一句续接该经历。
    // `stream`, when given, is the merged chain (L0) — the trajectory then has
    // no data source of its own. Without it the trajectory fetches one period,
    // the legacy path, which still works.
    selectPeriod: function (jobId, stream) {
      var meta = window.__proveTrackMeta || null;
      if (window.__proveTrackLoad) window.__proveTrackLoad(jobId, meta, stream);
    },
    showToast: showToast,
    onEnter: function (name, fn) { (ENTER[name] = ENTER[name] || []).push(fn); }
  };

  // One centered toast for system-level errors — never a Helix speech bubble
  // (a transport failure is not Helix talking, it is the cockpit reporting).
  function showToast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = '⚠ ' + msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 5000);
  }

  /* ---- status line (shell scope: shown in every view) ------------------- */
  function tick() {
    fetch('/api/snapshot').then(function (r) {
      if (!r.ok) { throw new Error('proxy ' + r.status); }
      return r.json();
    }).then(function (j) {
      var snap = j.snapshot || null;
      var mode = document.getElementById('mode');
      var st = document.getElementById('state');
      var conn = document.getElementById('conn');
      var sub = document.getElementById('sub');
      if (!snap) {
        mode.textContent = 'NO SNAPSHOT';
        st.textContent = j.status || '?';
        conn.textContent = '✗ 未就绪';
        conn.className = 'badge';
        sub.textContent = 'Anaphase 未提供快照（' + (j.error || j.status || '未知') + '）——检查 up 是否在运行';
        return;
      }
      var m = snap.mode || '?';
      // Honest status line: success path must leave the "连接中…" placeholder.
      sub.textContent = 'Anaphase 在线 · ' + m.toUpperCase() + ' · ' + (snap.episode || '暂无经历');
      mode.textContent = m.toUpperCase();
      mode.className = 'badge ' + m;
      st.textContent = 'state: ' + (snap.state || '?');
      conn.textContent = '● 在线';
      conn.className = 'badge live';
      // The situation view renders its own content; the shell only hands the
      // snapshot over (按需驱动：不替别的视图做渲染决定).
      if (window.CxCockpit) window.CxCockpit.render(snap);
    }).catch(function (e) {
      var conn = document.getElementById('conn');
      conn.textContent = '✗ 断开';
      conn.className = 'badge';
      document.getElementById('sub').textContent = 'snapshot 拉取失败: ' + e;
    });
  }

  // Ecosystem status board: one dot per component (grey=off, yellow=up
  // but unhealthy, green=healthy). Polled with the same cadence as tick.
  function loadEcosystem() {
    fetch('/api/ecosystem').then(function (r) { return r.json(); }).then(function (j) {
      var box = document.getElementById('eco');
      if (!box) return;
      var html = '';
      (j.components || []).forEach(function (c) {
        html += '<span class="c"><span class="dot ' + esc(c.state) + '"></span>' + esc(c.name) + '</span>';
      });
      box.innerHTML = html;
    }).catch(function () {
      var box = document.getElementById('eco');
      if (box) box.textContent = '生态探测不可用（proxy 未就绪）';
    });
  }

  /* Nav buttons are wired here from `data-view` — the markup declares the
   * view, the shell only connects it. No inline onclick means a new view
   * needs no shell edit at all. */
  (function () {
    var bs = navButtons();
    for (var i = 0; i < bs.length; i++) {
      (function (b) {
        b.addEventListener('click', function () {
          showView(b.getAttribute('data-view'));
        });
      })(bs[i]);
    }
  })();

  tick(); loadEcosystem();
  setInterval(tick, refresh * 1000);
  setInterval(loadEcosystem, refresh * 1000);
  // Inline `onclick` attributes resolve against the global scope — expose the
  // interactive entry points explicitly (they live in this IIFE).
  window.showView = showView;
  // 主题按钮状态初始化（与 head 引导脚本对齐）
  (function(){ try{
    var K='cellrix-theme', cur=localStorage.getItem(K)||'auto';
    var bs=document.querySelectorAll('.theme-switch button');
    for(var i=0;i<bs.length;i++){ bs[i].className=bs[i].getAttribute('data-t')===cur?'on':''; }
  }catch(e){} })();
  // 涟漪/降级探针/表格自证/契约自检 已下沉至 gleam.html（组件行为资产）
  // 会话管理（列表/重命名/续接/新对话）独立资产 session.html
  // 对话域 独立资产 chat.js · 态势域 独立资产 cockpit.js
})();
</script>
