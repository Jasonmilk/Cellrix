<script>
/* Shell — the frame every view shares: view switch, shared namespace, the
 * status line and the ecosystem board. View-specific rendering lives in its
 * own asset (chat.js / cockpit.js / session.html / flows.html / prove_track.*),
 * and a view declares its own enter hook via Cx.onEnter, so this file never
 * names a view it does not own.
 */
(function () {
  var refresh = __REFRESH__;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ---- view switch ------------------------------------------------------
   * The view list has exactly one source of truth: base.html's nav carries
   * `data-view` on every button. Adding a view = one nav entry + one
   * `#view-<name>` container + one asset file. This function never changes.
   * [GENE] 0 硬编码 —— 视图清单不写死在壳里。 */
  function navButtons() { return document.querySelectorAll('[data-view]'); }

  /* The default view is the one the markup marks as current. Read from the
   * markup rather than named here: the shell is not allowed to know a view it
   * does not own, and a name written here would be a second source for the
   * view list. */
  function defaultView() {
    var on = document.querySelector('.nav [data-view].on') || navButtons()[0];
    return on ? on.getAttribute('data-view') : null;
  }

  /* Enter hooks are declared by the view assets themselves (Cx.onEnter), so
   * the shell never names a view it does not own. Leaving is the mirror of
   * entering, declared the same way. */
  var ENTER = {}, LEAVE = {}, PERIOD = {};

  /* ---- the tape ---------------------------------------------------------
   * ONE tape for the panel (ADR-0018: one tape, many targets). Every view that
   * shows the same read feeds and reads this one, so two projections cannot
   * disagree about what happened. The shell owns its lifecycle; a view owns its
   * rendering.
   */
  var TAPE = null, TAPE_JOB = null, TAPE_REGISTERED = false;
  function tape() {
    if (!TAPE) { TAPE = window.CxAssembly.create(); }
    return TAPE;
  }
  /* Registration does no work (ADR-0018 D5): the factory is stored, never
   * called, and the target is built only when its view activates it. */
  function registerTargets(t) {
    if (TAPE_REGISTERED) { return; }
    TAPE_REGISTERED = true;
    if (window.CxProveTrack && window.CxProveTrack.target) {
      t.register('prove-track', window.CxProveTrack.target);
    }
  }

  /* Merge the chain containing `jobId` — or the newest experience when no
   * period was chosen — and hand ONE window to the tape. Returns the events,
   * which are the conversation's projection; the trajectory reads the same
   * window as nodes.
   *
   * L0 — TEMPORARY, same as mergeChain: retire when anaphase provides
   * session_id. A session is a container the runtime owns; until it exists the
   * shell reconstructs one from resume_from. `mergeChain` normalises ONCE,
   * after concatenation: normalising per period would restart gseq at 0 in
   * every file and refuse all but the first.
   *
   * This is the ONLY read of the chain. A second one would be a second source
   * for the same facts, which is how a trajectory and a conversation come to
   * tell different stories.
   */
  function loadWindow(jobId) {
    var NORM = window.CxNormalize;
    return fetch('/api/sessions?limit=500').then(function (r) { return r.json(); })
      .then(function (d) {
        var list = (d && d.periods) || [];
        var start = jobId || (list[0] && list[0].job_id) || null;
        if (!start) { throw new Error('没有可用的经历'); }
        var ids = NORM ? NORM.chainJobIds(list, start) : [start];
        if (!ids.length) { ids = [start]; }
        return Promise.all(ids.map(function (id) {
          return fetch('/api/events?job_id=' + encodeURIComponent(id))
            .then(function (r) { return r.json(); })
            .then(function (j) { return { id: id, events: (j && j.events) || [] }; });
        })).then(function (parts) { return { parts: parts, start: start, ordered: ids }; });
      })
      .then(function (w) {
        var byJob = {};
        w.parts.forEach(function (p) { byJob[p.id] = p.events; });
        var merged = NORM
          ? NORM.mergeChain(byJob, w.ordered)
          : { events: w.ordered.reduce(function (a, id) { return a.concat(byJob[id]); }, []),
              diagnostics: { ok: true } };
        if (!merged.diagnostics.ok) {
          throw new Error('事件流读取异常（' + (merged.diagnostics.reason || 'unknown') + '）—— 不猜测');
        }
        var t = tape();
        t.feed(merged.events);
        registerTargets(t);
        TAPE_JOB = w.start;
        var evs = t.events();
        t.flush();
        return { events: evs, jobs: w.ordered };
      });
  }

  /* ---- ONE selection state (ADR-0022 N-003) ------------------------------
   * At any instant there is exactly one "current view + current period", and it
   * lives here as `Cx.state.nav`. Every entry point — nav button, session card,
   * continuation, the address bar — funnels through `setNav`, the only writer.
   *
   * Measured before this change: the period was assigned at five sites across
   * three assets, and the view existed only as `style.display`. The address bar,
   * the sidebar and the trajectory could therefore each hold a different idea of
   * where we are, and nothing could report which one was current. */
  /* `panel` = 右栏侧板里开着哪个辅助面（N-001：主只有一个，其余是辅助）。
   * 它的语义在 N-001 落地时变了：以前是侧栏的"点击模式"，现在是"哪个辅助面开着"。 */
  var STATE = { nav: { view: null, period: null, panel: null }, sesSeq: 0, histSeq: 0, chatBusy: false };
  var NAV = STATE.nav;

  function hashFor(state) {
    return window.CxNormalize ? window.CxNormalize.buildHash(state) : '';
  }

  /* Writes nav, writes the address bar, renders. Nothing else writes nav —
   * not even the two paths that adopt what the address bar already says. */
  function setNav(patch, opts) {
    opts = opts || {};
    var before = NAV.view, beforePeriod = NAV.period, beforePanel = NAV.panel;
    if (patch) {
      if (patch.view) NAV.view = patch.view;
      if (patch.period !== undefined) NAV.period = patch.period || null;
      /* 侧板状态也由这只手写：N-001 之后"哪个辅助面开着"是同一份位置状态的一部分。 */
      if (patch.panel !== undefined) NAV.panel = patch.panel || null;
      /* The metadata cache is written by the same hand as the period it
       * describes, so it cannot come to describe a different period. */
      if (patch.meta !== undefined) window.__proveTrackMeta = patch.meta;
    }
    var viewChanged = NAV.view !== before;
    var periodChanged = NAV.period !== beforePeriod;
    var panelChanged = NAV.panel !== beforePanel;
    var want = hashFor(NAV);
    /* N-005: changing VIEW is a navigation and pushes an entry, so Back returns
     * to the view we came from. A period-only change (a reply creating a period,
     * continuing another) replaces the current entry instead, so Back does not
     * walk the conversation message by message. N-009: either way the address
     * bar is the serialisation of this state, never a stale copy of it.
     *
     * `opts.replace` is for the ADOPTING paths (boot, Back/Forward): the URL is
     * already the authority there, and normalising it must not mint a history
     * entry of its own. */
    try {
      if (opts.replace) {
        if (location.hash !== want) {
          history.replaceState(null, '', want || (location.pathname + location.search));
        }
      } else if (NAV.view !== before || NAV.panel !== beforePanel) {
        /* 开/收一个辅助面板也是导航：N-005 的后退要能退回上一个位置。 */
        if (location.hash !== want) location.hash = want;
      } else if (location.hash !== want) {
        history.replaceState(null, '', want || (location.pathname + location.search));
      }
    } catch (e) { /* an opaque origin must not stop the panel rendering */ }

    /* 视图变了才跑 enter hook。**这条是实测逼出来的**：以前每次 setNav（哪怕只是
     * 点了一张卡，period 变了而视图没变）都重跑 enter hook，于是 loadSessions
     * ——它是个 enter hook——每点一次卡就把整个侧栏 innerHTML 重建一遍：多打两次
     * /api/sessions、列表滚回顶部、刚点的那张卡被甩出视野（"不知道点了哪张卡了"）。
     *
     * 分工：enter = 进入这个视图时该做什么（取数、聚焦）；period = 同一视图内换了
     * 一段经历时该做什么（更新高亮、重载证轨的窗口）。选择变化不该重建你正在选择
     * 的那个集合——这是任何有列表的界面的基本形状。 */
    if (viewChanged || panelChanged) { applyView(NAV.view); applyPanel(); }
    else if (periodChanged) {
      /* 主视图与**开着的辅助面**都要知道 period 变了：证轨的窗口要跟着换。 */
      notifyPeriod(NAV.view);
      if (NAV.panel) notifyPeriod(NAV.panel);
    }
  }

  /* ── 右栏侧板（N-001）────────────────────────────────────────────────────
   * 辅助面住在这里：零宽轨道时它**悬在中栏之上**（DSH 的 rightbar 形状），
   * 全屏时中栏让位。面板自己一条高度链，内部各自滚。 */
  var PANEL_TITLE = { cockpit: '驾驶舱 Cockpit', 'prove-track': '证轨 ProveTrack', flows: '检定台 Flows' };
  function applyPanel() {
    var panel = NAV.panel || null;
    var box = document.getElementById('uxPanel');
    var main = document.getElementById('uxMain');
    if (!box || !main) return;
    box.hidden = !panel;
    /* 钩子叫 `data-open`，**不能叫 `data-panel`**：后者已经属于开关按钮，而下面
     * 那段接线是 `querySelectorAll('[data-panel]')` —— 同名会让它把框架也选中，
     * 于是框架的 className 被覆盖成按钮的类、`fxMain` 消失、grid 随之失效。
     * 实测：`#uxMain` 变成了 `class="btn btn-ghost on"`，主区高度塌成 297、侧板为 0。
     * 一个属性名两个含义——这类 bug 的教科书形态。 */
    if (panel) { main.setAttribute('data-open', panel); }
    else { main.removeAttribute('data-open'); main.removeAttribute('data-max'); }
    var t = document.getElementById('uxPanelT');
    if (t) t.textContent = panel ? (PANEL_TITLE[panel] || panel) : '';
    ['cockpit', 'prove-track', 'flows'].forEach(function (v) {
      var el = document.getElementById('view-' + v);
      if (el) { if (v === panel) { el.removeAttribute('hidden'); } else { el.setAttribute('hidden', ''); } }
    });
    /* 辅助面的 enter/leave hook 与主视图共用一套注册表：资产只声明一次。 */
    ['cockpit', 'prove-track', 'flows'].forEach(function (v) {
      if (v === panel) return;
      var lv = LEAVE[v] || [];
      for (var i = 0; i < lv.length; i++) lv[i]();
    });
    if (panel) {
      var hooks = ENTER[panel] || [];
      for (var k = 0; k < hooks.length; k++) hooks[k]();
    }
    var btns = document.querySelectorAll('[data-panel]');
    for (var b = 0; b < btns.length; b++) {
      var on = btns[b].getAttribute('data-panel') === panel;
      btns[b].setAttribute('aria-pressed', String(on));
      btns[b].className = 'btn btn-ghost' + (on ? ' on' : '');
    }
  }

  function togglePanel(name) {
    setNav({ panel: (NAV.panel === name) ? null : name });
  }

  function notifyPeriod(v) {
    var hooks = PERIOD[v] || [];
    for (var i = 0; i < hooks.length; i++) hooks[i]();
  }

  /* Renders a view and runs its enter/leave hooks. Does NOT write the state:
   * `showView` routes here through `setNav`, so the DOM cannot disagree with
   * `nav`. */
  function applyView(v) {
    v = v || defaultView();
    var bs = navButtons(), i, n;
    for (i = 0; i < bs.length; i++) {
      n = bs[i].getAttribute('data-view');
      var el = document.getElementById('view-' + n);
      if (el) el.style.display = (n === v) ? '' : 'none';
      bs[i].className = 'btn' + (n === v ? ' on' : '');
    }
    /* A view that is no longer on screen stops being driven — and, for a
     * target, stops being built at all (ADR-0018 D5). The shell iterates the
     * hooks it was given, so it still names no view it does not own. */
    for (var k in LEAVE) {
      if (!Object.prototype.hasOwnProperty.call(LEAVE, k) || k === v) { continue; }
      for (i = 0; i < LEAVE[k].length; i++) LEAVE[k][i]();
    }
    var hooks = ENTER[v] || [];
    for (i = 0; i < hooks.length; i++) hooks[i]();
  }

  window.Cx = {
    state: STATE,
    esc: esc,
    /* The single writer, and the renderer that reads it. A view is chosen by
     * setNav and by nothing else. */
    setNav: setNav,
    showView: function (v) { setNav({ view: v }); },
    // Explicit continuation (ADR-0026): nav.period 置位时，下一句续接该经历。
    // No stream parameter: the trajectory reads the tape, and the tape is fed
    // once by loadWindow. Handing a stream in as well was the second way in —
    // the reason the two projections could drift apart.
    selectPeriod: function (jobId, patch) {
      var p = { period: jobId || null };
      if (patch) {
        if (patch.view) p.view = patch.view;
        if (patch.meta !== undefined) p.meta = patch.meta;
      }
      /* `state` is a KEY of this object literal, not a local: writing
       * `state.x` here silently created a property on the DOM element with
       * id="state" instead (a named-access global), so Cx.state was never set
       * and every reader of the period saw null. Measured: the guard dropped
       * from 55 passed to 46 passed / 1 failed, and the panel reported
       * "经历列表拉取失败: Cannot read properties of undefined". Name the
       * owner. */
      /* 这里**不再**直接去清证轨的表格。
       *
       * 曾经的写法是先调 `__proveTrackLoad()` 再 `setNav()`，理由是「加载器先清、
       * 视图的 enter hook 负责填」。但那条理由只在**证轨是活动视图**时成立：
       * 在对话视图里点一张卡时，没有任何 enter hook 会来填它，于是表格被清成
       * "Loading…" 之后**永远停在那里**——和 Flows 那个「永恒加载态」是同一形状。
       *
       * 现在壳只写状态。谁显示、谁负责加载：证轨的 onEnter / onPeriod 自己清并
       * 自己填（`onEnter` 里本来就是「先清后 loadWindow」，顺序没变），而它不在
       * 屏上时不动它的 DOM——那时它本来也看不见，进视图时 onEnter 会把它换成正确
       * 的那一段。壳因此不再需要知道另一个资产里那个函数的名字。 */
      setNav(p);
    },
    showToast: showToast,
    onEnter: function (name, fn) { (ENTER[name] = ENTER[name] || []).push(fn); },
    onLeave: function (name, fn) { (LEAVE[name] = LEAVE[name] || []).push(fn); },
    /* 同一视图内 period 变化。与 onEnter 分开，是因为两者的正确触发时机不同：
     * 进入视图要重新取数，换一段经历不该把列表重建一遍。 */
    onPeriod: function (name, fn) { (PERIOD[name] = PERIOD[name] || []).push(fn); },
    /* The tape and its read, for a view that projects from it. */
    tape: tape,
    tapeJob: function () { return TAPE_JOB; },
    loadWindow: loadWindow
  };

  // One centered toast for system-level errors — never a Helix speech bubble
  // (a transport failure is not Helix talking, it is the cockpit reporting).
  function showToast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = '⚠ ' + msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 5000);
  }

  /* ---- status line (shell scope: shown in every view) ------------------- */
  function tick() {
    fetch('/api/snapshot').then(function (r) {
      if (!r.ok) { throw new Error('proxy ' + r.status); }
      return r.json();
    }).then(function (j) {
      var snap = j.snapshot || null;
      var mode = document.getElementById('mode');
      var st = document.getElementById('state');
      var conn = document.getElementById('conn');
      var sub = document.getElementById('sub');
      if (!snap) {
        mode.textContent = 'NO SNAPSHOT';
        st.textContent = j.status || '?';
        conn.textContent = '✗ 未就绪';
        conn.className = 'badge';
        sub.textContent = 'Anaphase 未提供快照（' + (j.error || j.status || '未知') + '）——检查 up 是否在运行';
        return;
      }
      var m = snap.mode || '?';
      // Honest status line: success path must leave the "连接中…" placeholder.
      sub.textContent = 'Anaphase 在线 · ' + m.toUpperCase() + ' · ' + (snap.episode || '暂无经历');
      mode.textContent = m.toUpperCase();
      mode.className = 'badge ' + m;
      st.textContent = 'state: ' + (snap.state || '?');
      conn.textContent = '● 在线';
      conn.className = 'badge live';
      // The situation view renders its own content; the shell only hands the
      // snapshot over (按需驱动：不替别的视图做渲染决定).
      if (window.CxCockpit) window.CxCockpit.render(snap);
    }).catch(function (e) {
      var conn = document.getElementById('conn');
      conn.textContent = '✗ 断开';
      conn.className = 'badge';
      /* 出路是时间：本函数由 setInterval 反复调用，面板自己在重试。所以这里渲染
       * 成说明而不是按钮——状态行的职责只是报告状态（ADR-0044 D5）。 */
      window.CxWayout.renderInline(document.getElementById('sub'),
        { code: 'snapshot-fetch-failed', detail: String(e && e.message || e) });
    });
  }

  // Ecosystem status board: one dot per component (grey=off, yellow=up
  // but unhealthy, green=healthy). Polled with the same cadence as tick.
  function loadEcosystem() {
    fetch('/api/ecosystem').then(function (r) { return r.json(); }).then(function (j) {
      var box = document.getElementById('eco');
      if (!box) return;
      var html = '';
      (j.components || []).forEach(function (c) {
        html += '<span class="c"><span class="dot ' + esc(c.state) + '"></span>' + esc(c.name) + '</span>';
      });
      box.innerHTML = html;
    }).catch(function () {
      var box = document.getElementById('eco');
      /* 同样：loadEcosystem 也在定时器上，出路是下几秒的重试。 */
      if (box) window.CxWayout.renderInline(box, 'ecosystem-unavailable');
    });
  }

  /* Nav buttons are wired here from `data-view` — the markup declares the
   * view, the shell only connects it. No inline onclick means a new view
   * needs no shell edit at all. */
  (function () {
    var bs = navButtons();
    for (var i = 0; i < bs.length; i++) {
      (function (b) {
        b.addEventListener('click', function () {
          /* 点主视图按钮 = 回到主界面：顺带收起辅助面板（title 里写着）。 */
          setNav({ view: b.getAttribute('data-view'), panel: null });
        });
      })(bs[i]);
    }
  })();

  /* ── 运行时能力清单 + 降级路径（照「水之波光 · 卷四」的纪律）──────────────
   * 原则：**检测不到，一律走更安全的一侧**。多一道暗示无害，缺一道才丢信息。
   * 这张表是给测试与审计看的：每项能力都必须写明缺失时走哪条路，
   * 而"每一行都有那一列"是机器可检查的（见 all_views_test.js）。
   */
  var HAS = (function () {
    function mq(q) { try { return !!(window.matchMedia && matchMedia(q).matches); } catch (e) { return false; } }
    function sup(prop, val) { try { return !!(window.CSS && CSS.supports && CSS.supports(prop, val)); } catch (e) { return false; } }
    var passive = false;
    try {
      var o = Object.defineProperty({}, 'passive', { get: function () { passive = true; return false; } });
      window.addEventListener('_cx_probe', null, o); window.removeEventListener('_cx_probe', null, o);
    } catch (e) {}
    return {
      passive: passive,
      ro: !!window.ResizeObserver,
      clip: sup('overflow', 'clip'),
      gutter: sup('scrollbar-gutter', 'stable'),
      dvh: sup('height', '100dvh'),
      fv: sup('selector(:focus-visible)'),
      hover: mq('(hover:hover)'),
      fine: mq('(pointer:fine)'),
      coarse: mq('(pointer:coarse)'),
      reduced: mq('(prefers-reduced-motion: reduce)'),
      contrast: mq('(prefers-contrast: more)'),
      forced: mq('(forced-colors: active)')
    };
  })();

  /* 每一项能力缺失时走哪条路。缺一行就是"没想清楚"，不是"不需要"。 */
  var FALLBACK = {
    passive: 'addEventListener 退化为 false：滚动照常，仅性能略降',
    ro: '改用 scroll + resize 事件重算边缘暗示',
    clip: '退化为 overflow:hidden：容器无法外部溢出（本页无此需求）',
    gutter: '退化为 html{overflow-y:scroll}：滚动条槽位常驻，同样不横移',
    dvh: '应用区用 100vh：移动端地址栏收放会有一次高度跳变（可接受）',
    fv: '改用 :focus 兜底：键盘与鼠标都有焦点环（多一道无害）',
    hover: '禁用全部粘滞 hover：点完还亮着 = 让已处理内容保持显著',
    fine: '按触摸处理：热区升 44px',
    coarse: '按桌面处理：热区 36px',
    reduced: '缩短动效而非删除：因果仍可见，位移取消',
    contrast: '边界改用实色线，渐隐类暗示让位于实色边界',
    forced: '图案让位于系统色，阶段名仍是文字，编码不丢'
  };

  /* ── 遮挡自证（L4）：容器被裁掉的那一边才亮渐隐 ─────────────────────────
   * 与证轨的 .e-eg 同一套令牌（--fade-w / --fade-l / --fade-r），只是推广到
   * 所有滚动容器。四方向各一个 data 位；滚动、尺寸变化、窗口变化都要重算。 */
  function initEdges(vp, sc) {
    if (!vp || !sc) return;
    function upd() {
      if (!sc.parentNode) return;
      vp.setAttribute('data-t', sc.scrollTop <= 1 ? '0' : '1');
      vp.setAttribute('data-b', (sc.scrollTop + sc.clientHeight < sc.scrollHeight - 1) ? '1' : '0');
      vp.setAttribute('data-l', sc.scrollLeft > 1 ? '1' : '0');
      vp.setAttribute('data-r', (sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 1) ? '1' : '0');
    }
    sc.addEventListener('scroll', upd, HAS.passive ? { passive: true } : false);
    if (HAS.ro) { new ResizeObserver(upd).observe(sc); }
    window.addEventListener('resize', upd);
    upd();
    return upd;
  }
  var updSideEdges = initEdges(document.getElementById('uxSideVp'), document.getElementById('uxSideBody'));
  /* 侧栏收起：一格轨道归零，列表隐藏（它自己那条滚动上下文随之消失）。 */
  (function () {
    var t = document.getElementById('tglSide');
    var frame = document.getElementById('uxFrame');
    var side = document.getElementById('uxSide');
    if (!t || !frame || !side) return;
    t.addEventListener('click', function () {
      var on = frame.getAttribute('data-side') === '1';
      if (on) { frame.setAttribute('data-side', '0'); side.setAttribute('hidden', ''); }
      else { frame.setAttribute('data-side', '1'); side.removeAttribute('hidden'); }
      t.setAttribute('aria-expanded', String(!on));
      if (updSideEdges) setTimeout(updSideEdges, 0);
    });
  })();

  tick(); loadEcosystem();
  setInterval(tick, refresh * 1000);
  setInterval(loadEcosystem, refresh * 1000);
  // Inline `onclick` attributes resolve against the global scope — expose the
  // interactive entry points explicitly (they live in this IIFE).
  window.showView = function (v) { setNav({ view: v }); };

  /* 辅助面板：切换 / 关闭 / 全屏。开关本身只写状态，显示由 applyPanel 负责。 */
  (function () {
    var bs = document.querySelectorAll('[data-panel]');
    for (var i = 0; i < bs.length; i++) {
      (function (b) {
        b.addEventListener('click', function () { togglePanel(b.getAttribute('data-panel')); });
      })(bs[i]);
    }
    var x = document.getElementById('uxPanelX');
    if (x) x.addEventListener('click', function () { setNav({ panel: null }); });
    var mx = document.getElementById('uxPanelMax');
    if (mx) mx.addEventListener('click', function () {
      var main = document.getElementById('uxMain');
      var on = main.getAttribute('data-max') === '1';
      if (on) { main.removeAttribute('data-max'); } else { main.setAttribute('data-max', '1'); }
      this.setAttribute('aria-pressed', String(!on));
    });
  })();

  /* N-009: read the address bar once. Deferred to DOMContentLoaded because the
   * view assets register their enter hooks while the page parses — prove_track.js
   * defers its own registration to exactly this event — and a restored
   * `#view=…` that ran before those hooks existed would restore the chrome and
   * leave the view empty. */
  function bootNav() {
    var N = window.CxNormalize;
    var from = N ? N.parseHash(location.hash) : { view: null, period: null, panel: null };
    /* N-010: total by construction — a hash the panel did not write yields an
     * empty state, and the default view still renders. */
    setNav({ view: from.view || defaultView(), period: from.period || null, panel: from.panel || null },
      { replace: true });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', bootNav); }
  else { bootNav(); }

  /* N-005: Back and Forward keep working between views. The browser already
   * owns that history; this only adopts what the address bar now says. Guarded
   * against the hash this shell itself just wrote, so applying it cannot loop. */
  window.addEventListener('hashchange', function () {
    var N = window.CxNormalize;
    if (!N) return;
    var from = N.parseHash(location.hash);
    if (from.view === NAV.view && from.period === NAV.period && from.panel === NAV.panel) { return; }
    setNav({ view: from.view || defaultView(), period: from.period || null, panel: from.panel || null },
      { replace: true });
  });
  // 主题按钮状态初始化（与 head 引导脚本对齐）
  (function(){ try{
    var K='cellrix-theme', cur=localStorage.getItem(K)||'auto';
    var bs=document.querySelectorAll('.theme-switch button');
    for(var i=0;i<bs.length;i++){ bs[i].className=bs[i].getAttribute('data-t')===cur?'on':''; }
  }catch(e){} })();
  // 涟漪/降级探针/表格自证/契约自检 已下沉至 gleam.html（组件行为资产）
  // 会话管理（列表/重命名/续接/新对话）独立资产 session.html
  // 对话域 独立资产 chat.js · 态势域 独立资产 cockpit.js
})();
</script>
